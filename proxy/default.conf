# nginx config for the Linkly proxy.
# Listens on 8080 (HTTP) and 8443 (HTTPS) so nginx does not need root to bind ports.
# Map host ports to these with -p, for example -p 80:8080 -p 443:8443.

server {
    listen 8080;

    # Health endpoint for the proxy's own HEALTHCHECK.
    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location / {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
