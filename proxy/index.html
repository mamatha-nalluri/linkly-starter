<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkly — URL Shortener</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 40px rgba(20, 35, 65, 0.1);
    }

    h1 { margin: 0 0 8px; }
    p { color: #5d687b; line-height: 1.5; }

    label {
      display: block;
      margin: 24px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #shorten {
      width: 100%;
      margin-top: 14px;
      color: white;
      background: #2459d3;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    #result {
      margin-top: 22px;
      overflow-wrap: anywhere;
    }

    #shortUrl {
      display: block;
      margin: 10px 0;
      font-weight: 600;
    }

    #copy {
      color: #2459d3;
      background: #eaf0ff;
    }

    #message { min-height: 24px; }
    .error { color: #b42318; }
    .success { color: #18794e; }
  </style>
</head>
<body>
  <main>
    <h1>Linkly</h1>
    <p>Turn a long URL into a short, shareable link.</p>

    <form id="shortenForm">
      <label for="longUrl">Paste your long URL</label>
      <input
        id="longUrl"
        name="longUrl"
        type="url"
        placeholder="https://example.com/a/very/long/link"
        required
      >
      <button id="shorten" type="submit">Shorten URL</button>
    </form>

    <section id="result" hidden>
      <strong>Your short URL</strong>
      <a id="shortUrl" href=""></a>
      <button id="copy" type="button">Copy link</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("shortenForm");
    const input = document.getElementById("longUrl");
    const shortenButton = document.getElementById("shorten");
    const result = document.getElementById("result");
    const shortUrl = document.getElementById("shortUrl");
    const copyButton = document.getElementById("copy");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.hidden = true;
      message.className = "";
      message.textContent = "";
      shortenButton.disabled = true;
      shortenButton.textContent = "Creating link...";

      try {
        const parsedUrl = new URL(input.value.trim());

        if (!["http:", "https:"].includes(parsedUrl.protocol)) {
          throw new Error("Please enter an HTTP or HTTPS URL.");
        }

        const response = await fetch("/links", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: parsedUrl.href })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || "Could not create the short link.");
        }

        const generatedUrl = new URL(
          "/" + encodeURIComponent(data.code),
          window.location.origin
        );

        shortUrl.href = generatedUrl.href;
        shortUrl.textContent = generatedUrl.href;
        result.hidden = false;
        message.textContent = "Your link is ready.";
        message.className = "success";
      } catch (error) {
        message.textContent =
          error instanceof TypeError
            ? "Could not connect to Linkly. Check that the services are running and try again."
            : error.message;
        message.className = "error";
      } finally {
        shortenButton.disabled = false;
        shortenButton.textContent = "Shorten URL";
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shortUrl.href);
        message.textContent = "Short URL copied to clipboard.";
        message.className = "success";
      } catch {
        message.textContent = "Copy failed. Select and copy the short URL above.";
        message.className = "error";
      }
    });
  </script>
</body>
</html>
